name: Build and deploy website

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 8 * * *"   # daily, ~3:23am Toronto: rebuild schedules for the next 3 days
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download and preprocess GTFS feeds
        run: python -m gta_transit update
      - name: Export site
        run: |
          python -m gta_transit export-web --out _site --days 3 \
            --live-url "https://raw.githubusercontent.com/${{ github.repository }}/live/live.json"
          cp web/* _site/
          touch _site/.nojekyll
          du -sh _site
      - name: Save GTFS cache for the live updater
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: gtfs-cache-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
